name: Deploy Web Wrapper & Run Selenium E2E

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  # The GitHub Pages URL for the repo (e.g. https://<username>.github.io/<repo>/)
  # When deployed, the actual Expo app is at /app/
  BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install Mobile Dependencies
        working-directory: ./mobile
        run: npm ci

      - name: Build Expo Web App
        working-directory: ./mobile
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
        run: |
          # Inject baseUrl for GitHub pages routing
          npm install -g replace-json-property
          replace-json-property app.json expo.experiments.baseUrl "/${{ github.event.repository.name }}/app"
          
          # Export the web build
          npx expo export -p web
          
          # Move build output to the web wrapper's public app folder
          mkdir -p ../web/app
          cp -R dist/* ../web/app/

      - name: Prepare Wrapper
        working-directory: ./web
        run: |
          # The web wrapper is purely static HTML/CSS. 
          # No build step is needed for the wrapper itself.
          mkdir -p public
          cp index.html public/
          cp -R app public/app

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './web/public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-and-test:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Wait for Deployment Availability
        run: |
          echo "Verifying deployment at $BASE_URL"
          # Wait up to 2 minutes for the site to return HTTP 200
          for i in {1..24}; do
            STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" $BASE_URL)
            if [ "$STATUS_CODE" -eq 200 ]; then
              echo "Deployment verified. HTTP 200 received."
              exit 0
            fi
            echo "Waiting for site to become available... (Status: $STATUS_CODE)"
            sleep 5
          done
          echo "Deployment verification failed. The site is not available."
          exit 1

      - name: Install Selenium Dependencies
        working-directory: ./automation
        run: |
          pip install -r requirements.txt
          # Setup Chrome and ChromeDriver for headless execution
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Run Selenium E2E Tests
        working-directory: ./automation
        env:
          TEST_BASE_URL: ${{ env.BASE_URL }}
        run: |
          # We don't want the workflow to hard-fail immediately on a test failure.
          # We want to continue so we can upload the reports and summarize.
          python -m pytest tests/ --junitxml=reports/results.xml || true
          
          # Generate Excel/HTML Reports based on test results
          python utils/generate_reports.py

      - name: Check E2E Pass Criteria
        working-directory: ./automation
        run: |
          # Fails the step if the critical threshold is not met based on reports
          python utils/check_thresholds.py

      - name: Publish Test Summary
        if: always()
        working-directory: ./automation
        run: |
          cat reports/summary.md >> $GITHUB_STEP_SUMMARY

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-test-reports
          path: |
            automation/reports/
            automation/screenshots/
            automation/logs/
          retention-days: 30
